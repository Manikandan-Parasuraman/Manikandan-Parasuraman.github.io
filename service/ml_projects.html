<!DOCTYPE html>
<html>
<head>
  <title>ML Regression Playground</title>
  <style>
    body { font-family: Arial; margin: 0; }
    header {
      display: flex;
      justify-content: flex-end;
      background: #222;
      padding: 10px;
    }
    header button {
      margin-left: 10px;
      padding: 8px 12px;
      color: white;
      background: #444;
      border: none;
      cursor: pointer;
    }
    header button:hover {
      background: #666;
    }
    .content {
      padding: 20px;
    }
  </style>
</head>

<body>

<header>
  <button onclick="loadModel('linear')">Linear</button>
  <button onclick="loadModel('polynomial')">Polynomial</button>
  <button onclick="loadModel('ridge')">Ridge</button>
  <button onclick="loadModel('lasso')">Lasso</button>
</header>

<div class="content" id="content">
  <h2>Welcome</h2>
  <p>Select a regression model from the top right.</p>
</div>

<script>
function loadModel(type) {
  const content = document.getElementById("content");

  const data = {
    linear: `
      <h2>Linear Regression</h2>
      <p>y = mx + c</p>
      <p>Used for simple relationships.</p>
    `,
    polynomial: `
      <h2>Polynomial Regression</h2>
      <p>y = ax² + bx + c</p>
      <p>Used for curved data.</p>
    `,
    ridge: `
      <h2>Ridge Regression</h2>
      <p>L2 Regularization</p>
    `,
    lasso: `
      <h2>Lasso Regression</h2>
      <p>L1 Regularization</p>
    `
  };

  content.innerHTML = data[type];
}
</script>

</body>
</html>
